<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura y Descripción de Imagen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #videoStream, #photoPreview {
      margin-top: 20px;
      border: 2px solid #ddd;
      border-radius: 5px;
    }
    textarea {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      resize: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Captura y Descripción de Imagen</h1>
  <button id="btnOpenCamera">Abrir Cámara</button>
  <video id="videoStream" autoplay playsinline style="display: none; width: 100%; max-width: 400px;"></video>
  <button id="btnCapture" style="display: none;">Tomar Foto</button>
  <canvas id="canvasOutput" style="display: none;"></canvas>
  <img id="photoPreview" alt="Preview de la Foto" style="display: none; width: 100%; max-width: 400px;" />
  <button id="btnNewPhoto" style="display: none;">Tomar Nueva Foto</button>
  <textarea id="description" placeholder="Descripción generada por IA" readonly rows="4"></textarea>
  <script src="script.js"></script>
</body>
</html>
